
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOL Control 0.3</title>
<style>
:root{font-family:system-ui;background:#f3f5fa;color:#202638}
body{margin:0}
header{background:#174da5;color:white;padding:18px}
main{max-width:750px;margin:auto;padding:14px}
.card{background:white;border-radius:12px;padding:15px;margin:12px 0;box-shadow:0 1px 4px #0002}
button,input,select,textarea{font:inherit;padding:10px;margin:4px;border:1px solid #bbc4d2;border-radius:8px}
button{background:#174da5;color:white;cursor:pointer}
nav{display:flex;flex-wrap:wrap}
nav button{flex:1;min-width:120px}
textarea,input{max-width:95%}
textarea{width:95%;min-height:80px}
.hidden{display:none}
.dark{background:#121827;color:#eee}
.dark .card{background:#202b3d}
small{color:#68768c}
.dark small{color:#b7c5d8}
</style>
</head>
<body>
<header>
<h2>SOL Control 0.3</h2>
<div>Локальна панель керування · без підключення до ШІ</div>
</header>
<main>
<nav id="nav"></nav>
<section id="content"></section>
</main>
<script>
const KEY='sol_control_03';
const OLD=['sol_control_02','solControl','sol_control_data'];
let data={
 tasks:[],
 reports:[],
 journal:[],
 permissions:{
  drafts:true,
  tasks:true,
  financial:false,
  signing:false,
  sending:false
 },
 priorities:'',
 theme:'light'
};
try{
 let v=localStorage.getItem(KEY);
 if(v){
  data={...data,...JSON.parse(v)};
 }else{
  for(let k of OLD){
   let old=localStorage.getItem(k);
   if(old){
    let o=JSON.parse(old);
    if(Array.isArray(o.tasks))data.tasks=o.tasks;
    if(o.priorities)data.priorities=o.priorities;
    break;
   }
  }
 }
}catch(e){
 alert('Не вдалося прочитати старі дані. Їх не видалено.');
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
}[c]));
const sections=[
 'Завдання','Звіти','Журнал',
 'Дозволи','Пріоритети','Налаштування'
];
let current='Завдання';
function log(s){
 data.journal.unshift({
  date:new Date().toLocaleString('uk-UA'),
  text:s
 });
 save();
}
function render(){
 document.getElementById('nav').innerHTML=sections.map(s=>
  `<button onclick="openSection('${s}')">${s}</button>`
 ).join('');
 let h='';
 if(current==='Завдання'){
  h='<div class="card"><h3>Нове завдання</h3><input id="task" placeholder="Назва завдання"><button onclick="addTask()">Додати</button></div>'+
  data.tasks.map((t,i)=>`
   <div class="card">
   <b>${esc(typeof t==='string'?t:t.title||t.name||'Завдання')}</b>
   <p>Статус: ${esc(t.status||'Нове')}</p>
   <button onclick="statusTask(${i})">Змінити статус</button>
   <button onclick="removeTask(${i})">Видалити</button>
   </div>
  `).join('');
 }
 if(current==='Звіти'){
  h='<div class="card"><h3>Підсумковий звіт</h3><input id="reportTitle" placeholder="Назва"><textarea id="reportText" placeholder="Повний результат та висновки"></textarea><button onclick="addReport()">Зберегти звіт</button></div>'+
  data.reports.map(r=>`
   <div class="card">
   <b>${esc(r.title)}</b>
   <p>${esc(r.date)}</p>
   <p style="white-space:pre-wrap">${esc(r.text)}</p>
   </div>
  `).join('');
 }
 if(current==='Журнал'){
  h=data.journal.map(x=>`
   <div class="card">
   <small>${esc(x.date)}</small>
   <p>${esc(x.text)}</p>
   </div>
  `).join('')||'<div class="card">Записів ще немає.</div>';
 }
 if(current==='Дозволи'){
  let labels={
   drafts:'Чернетки без запиту',
   tasks:'Оновлення завдань без запиту',
   financial:'Фінансові операції',
   signing:'Підписання документів',
   sending:'Надсилання третім особам'
  };
  h='<div class="card"><h3>Матриця дозволів</h3><p>Фінанси, підписання й надсилання потребують окремого підтвердження. Ці перемикачі лише записують правила, не надають ШІ реальних повноважень.</p>'+
  Object.entries(labels).map(([k,v])=>`
   <p><label>
   <input type="checkbox" ${data.permissions[k]?'checked':''}
   onchange="changePermission('${k}',this.checked)">
   ${v}</label></p>
  `).join('')+'</div>';
 }
 if(current==='Пріоритети'){
  h=`<div class="card">
   <h3>Пріоритетні напрями</h3>
   <textarea id="priorities">${esc(data.priorities)}</textarea>
   <button onclick="savePriorities()">Зберегти</button>
   </div>`;
 }
 if(current==='Налаштування'){
  h='<div class="card"><h3>Резервна копія</h3><button onclick="exportData()">Експортувати JSON</button><p>Імпорт із файлу:</p><input type="file" id="import" accept=".json,application/json"><button onclick="importData()">Імпортувати</button><p><button onclick="toggleTheme()">Світла / темна тема</button></p><small>Дані зберігаються лише в цьому браузері. Перед заміною пристрою експортуй копію.</small></div>';
 }
 document.getElementById('content').innerHTML=h;
 document.body.className=data.theme==='dark'?'dark':'';
}
function openSection(s){
 current=s;
 render();
}
function addTask(){
 let v=document.getElementById('task').value.trim();
 if(!v)return;
 data.tasks.push({title:v,status:'Нове'});
 log('Створено завдання: '+v);
 render();
}
function statusTask(i){
 let t=data.tasks[i];
 if(typeof t==='string'){
  t=data.tasks[i]={title:t,status:'Нове'};
 }
 let states=['Нове','В роботі','Завершено'];
 t.status=states[(states.indexOf(t.status)+1)%3];
 log('Оновлено статус завдання');
 render();
}
function removeTask(i){
 if(!confirm('Видалити завдання?'))return;
 data.tasks.splice(i,1);
 log('Видалено завдання');
 render();
}
function addReport(){
 let title=document.getElementById('reportTitle').value.trim();
 let text=document.getElementById('reportText').value.trim();
 if(!title||!text)return;
 data.reports.unshift({
  title,text,date:new Date().toLocaleString('uk-UA')
 });
 log('Створено підсумковий звіт: '+title);
 render();
}
function changePermission(k,v){
 if(['financial','signing','sending'].includes(k)&&v){
  alert('Ці дії вимагають окремого підтвердження для кожної операції.');
  render();
  return;
 }
 data.permissions[k]=v;
 log('Оновлено правило: '+k);
 render();
}
function savePriorities(){
 data.priorities=document.getElementById('priorities').value;
 log('Оновлено пріоритети');
 render();
}
function toggleTheme(){
 data.theme=data.theme==='dark'?'light':'dark';
 save();
 render();
}
function exportData(){
 let a=document.createElement('a');
 let u=URL.createObjectURL(new Blob(
  [JSON.stringify(data,null,2)],
  {type:'application/json'}
 ));
 a.href=u;
 a.download='sol-control-backup.json';
 a.click();
 setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function importData(){
 let f=document.getElementById('import').files[0];
 if(!f)return;
 let r=new FileReader();
 r.onload=()=>{
  try{
   let d=JSON.parse(r.result);
   if(!Array.isArray(d.tasks)||!Array.isArray(d.reports)){
    throw Error('Формат');
   }
   if(confirm('Замінити поточні дані імпортованими?')){
    data={...data,...d};
    log('Імпортовано резервну копію');
    render();
   }
  }catch(e){
   alert('Некоректний файл резервної копії');
  }
 };
 r.readAsText(f);
}
render();
</script>
</body>
</html>
